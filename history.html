<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>

    :root{
      --bg:#050505; --panel:#0a0a0a; --cyan:#00e5ff; --red:#ff2d55;
      --green:#00e676; --yellow:#ffd60a; --blue:#2979ff; --magenta:#ff2dd4;
      --text:#f2f2f2; --muted:#9aa0a6;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{
      background:radial-gradient(circle at top, #101010 0%, #000 70%);
      color:var(--text); font-family:'Segoe UI', Tahoma, sans-serif;
      max-width:520px; margin:0 auto; min-height:100vh;
      padding-bottom:78px; position:relative;
    }
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 14px; border-bottom:2px solid var(--red);
      box-shadow:0 0 18px rgba(255,45,85,0.45);
      background:#000; position:sticky; top:0; z-index:500;
    }
    .topbar .title{
      font-weight:800; font-size:15px; text-align:center; flex:1;
      letter-spacing:0.5px; text-shadow:0 0 8px var(--cyan);
    }
    .icon-btn{
      background:none; border:none; color:var(--cyan); font-size:22px;
      cursor:pointer; text-shadow:0 0 8px var(--cyan); position:relative;
    }
    .back-btn{background:none;border:none;color:var(--cyan);font-size:20px;cursor:pointer;text-shadow:0 0 8px var(--cyan);}
    .container{padding:16px 14px;}
    .section-title{
      text-align:center; color:var(--green); font-size:18px; font-weight:700;
      border-bottom:2px solid var(--cyan); padding-bottom:10px; margin-bottom:16px;
      text-shadow:0 0 8px var(--green);
    }
    .bottom-nav{
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:520px; display:flex; justify-content:space-around;
      background:#000; border-top:2px solid var(--red); padding:10px 0 14px;
      box-shadow:0 0 18px rgba(255,45,85,0.45); z-index:500;
    }
    .nav-item{
      display:flex; flex-direction:column; align-items:center; gap:3px;
      color:var(--muted); text-decoration:none; font-size:11px;
    }
    .nav-item.active{color:var(--cyan); text-shadow:0 0 8px var(--cyan);}
    .nav-item .nav-icon{font-size:20px;}
    .side-menu{
      position:fixed; top:0; left:-320px; width:280px; height:100vh;
      background:#000; border-right:2px solid var(--blue); z-index:2000;
      transition:left 0.3s ease; padding:20px 18px; overflow-y:auto;
      box-shadow:0 0 25px rgba(41,121,255,0.5);
    }
    .side-menu.open{left:0;}
    .side-menu-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1999; display:none;}
    .side-menu-overlay.show{display:block;}
    .side-menu-header{display:flex; align-items:center; gap:12px; margin-bottom:6px; margin-top:20px;}
    .side-menu-header img{width:46px; height:46px; border-radius:50%; border:2px solid var(--red); object-fit:cover;}
    .side-menu-header .name{font-weight:800; font-size:14px;}
    .side-menu-header .ver{font-size:11px; color:var(--muted);}
    .side-menu hr{border:none; border-top:2px solid var(--blue); margin:14px 0;}
    .side-menu a{
      display:block; padding:13px 14px; margin-bottom:10px; border-radius:10px;
      border:1.5px solid var(--cyan); color:#fff; text-decoration:none; font-size:14px;
    }
    .close-menu{position:absolute; top:16px; right:16px; background:none; border:none; color:#fff; font-size:20px;}
    .fab-support{
      position:fixed; bottom:88px; right:16px; width:52px; height:52px;
      border-radius:50%; background:#111; border:2px solid var(--red);
      display:flex; align-items:center; justify-content:center; font-size:24px;
      box-shadow:0 0 16px rgba(255,45,85,0.7); z-index:400; text-decoration:none;
    }
    .loading-wrap{display:flex; align-items:center; justify-content:center; min-height:50vh;}
    .spinner{width:44px; height:44px; border:4px solid #222; border-top-color:var(--cyan); border-radius:50%; animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .hidden{display:none !important;}


    .hist-tabs{display:flex; gap:10px; margin-bottom:16px;}
    .hist-tab{flex:1; padding:10px; text-align:center; border-radius:10px; border:1.5px solid var(--blue); color:#8fb3ff; cursor:pointer; font-size:13px;}
    .hist-tab.active{background:#001a33; color:#fff; box-shadow:0 0 10px rgba(41,121,255,0.6);}
    .hist-card{border:1.5px solid #333; border-radius:12px; padding:13px; margin-bottom:12px; font-size:13px;}
    .hist-card .row{display:flex; justify-content:space-between; margin-bottom:4px;}
    .status{padding:2px 10px; border-radius:12px; font-size:11px; font-weight:700;}
    .status.pending{background:#3a2f00; color:var(--yellow);}
    .status.completed{background:#00330f; color:var(--green);}
    .status.approved{background:#00330f; color:var(--green);}
    .status.rejected{background:#3a0000; color:var(--red);}
    .empty-state{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}

</style>
</head>
<body>

  <div class="topbar">
    <button class="icon-btn" onclick="openMenu()"><i class="fa-solid fa-bars"></i></button>
    <div class="title">HM-NAYEM-TELECOM<br>হিস্টরি</div>
    <button class="icon-btn" onclick="window.location.href='notifications.html'">
      <i class="fa-solid fa-bell"></i><span class="bell-dot" id="bellDot"></span>
    </button>
  </div>
<div id="loading" class="loading-wrap"><div class="spinner"></div></div>
<div id="main-content" class="hidden">



<div class="container">
  <div class="hist-tabs">
    <div class="hist-tab active" id="tabOrders" onclick="switchHist('orders')">রিচার্জ/অর্ডার</div>
    <div class="hist-tab" id="tabDeposits" onclick="switchHist('deposits')">ডিপোজিট</div>
  </div>
  <div id="histList"><div class="empty-state">লোড হচ্ছে...</div></div>
</div>

</div>


<div class="bottom-nav">
  <a href="home.html" class="nav-item active"><span class="nav-icon"><i class="fa-solid fa-house"></i></span>হোম</a>
  <a href="chat.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-comment-dots"></i></span>ইনবক্স</a>
  <a href="profile.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-user"></i></span>প্রফাইল</a>
</div>


<div class="side-menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
<div class="side-menu" id="sideMenu">
  <button class="close-menu" onclick="closeMenu()"><i class="fa-solid fa-xmark"></i></button>
  <div class="side-menu-header">
    <img src="png/logo.png" alt="logo" onerror="this.src='https://placehold.co/46x46/000/0ff?text=HM'">
    <div>
      <div class="name">HM-NAYEM-TELECOM<br>BANGLADESH</div>
      <div class="ver">Version: 0.9.205</div>
    </div>
  </div>
  <hr>
  <a href="privacy-policy.html">Privacy and Policy</a>
  <a href="rules.html">Rules</a>
  <a href="about.html">About</a>
  <a href="developer-info.html">Developer Info</a>
</div>

<script src="firebase-config.js"></script>
<script>

  function openMenu(){
    document.getElementById('sideMenu').classList.add('open');
    document.getElementById('menuOverlay').classList.add('show');
  }
  function closeMenu(){
    document.getElementById('sideMenu').classList.remove('open');
    document.getElementById('menuOverlay').classList.remove('show');
  }


  let histUser = null;
  let histType = 'orders';
  let activeListenerRef = null; // আগের ট্যাবের লিসেনার সরিয়ে রাখতে (মেমরি লিক এড়াতে)

  function statusLabel(s){
    const map = {pending:'পেন্ডিং', completed:'সম্পন্ন', approved:'অনুমোদিত', rejected:'বাতিল'};
    return map[s] || s;
  }

  function switchHist(type){
    histType = type;
    document.getElementById('tabOrders').classList.toggle('active', type==='orders');
    document.getElementById('tabDeposits').classList.toggle('active', type==='deposits');
    loadHistory();
  }

  function renderHistItems(itemsObj){
    const wrap = document.getElementById('histList');

    // অ্যাডমিন প্যানেলের মতোই — পুরো নোড থেকে শুধু নিজের userId মিলিয়ে ফিল্টার করা হচ্ছে
    const items = [];
    Object.keys(itemsObj || {}).forEach(key => {
      const d = itemsObj[key];
      if(d && d.userId === histUser.uid) items.push(d);
    });

    if(items.length === 0){
      wrap.innerHTML = '<div class="empty-state">কোনো তথ্য নেই</div>';
      return;
    }

    items.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    const top50 = items.slice(0, 50);

    wrap.innerHTML = '';
    top50.forEach(d => {
      const time = d.createdAt ? new Date(d.createdAt).toLocaleString('bn-BD') : '';
      const div = document.createElement('div');
      div.className = 'hist-card';
      // ইউজারের ফ্রি-টেক্সট ইনপুট (নাম্বার/ট্রানজেকশন আইডি) escapeHtml দিয়ে বসানো হচ্ছে, XSS আটকাতে
      if(histType === 'orders'){
        div.innerHTML = `
          <div class="row"><span>${escapeHtml(d.offerName || d.operator || 'রিচার্জ')}</span><span class="status ${d.status}">${statusLabel(d.status)}</span></div>
          <div class="row"><span>নাম্বারঃ ${escapeHtml(d.number||'-')}</span><span>৳${(d.amount||0).toFixed(2)}</span></div>
          <div class="row"><span style="color:#777;">${time}</span></div>`;
      } else {
        div.innerHTML = `
          <div class="row"><span>${escapeHtml((d.gateway||'').toUpperCase())}</span><span class="status ${d.status}">${statusLabel(d.status)}</span></div>
          <div class="row"><span>Trx: ${escapeHtml(d.trxId||'-')}</span><span>৳${(d.amount||0).toFixed(2)}</span></div>
          <div class="row"><span style="color:#777;">${time}</span></div>`;
      }
      wrap.appendChild(div);
    });
  }

  function loadHistory(){
    const wrap = document.getElementById('histList');
    wrap.innerHTML = '<div class="empty-state">লোড হচ্ছে...</div>';

    // ট্যাব বদলালে আগের নোডের লিসেনার বন্ধ করে দেওয়া হচ্ছে
    if(activeListenerRef) activeListenerRef.off('value');

    const currentHistType = histType;
    activeListenerRef = db.ref(currentHistType);
    activeListenerRef.on('value', snap => {
      if(currentHistType !== histType) return; // ট্যাব বদলে গেলে পুরনো রেসপন্স ইগনোর
      renderHistItems(snap.val());
    }, () => {
      if(currentHistType !== histType) return;
      wrap.innerHTML = '<div class="empty-state">তথ্য লোড করা যায়নি, আবার চেষ্টা করুন</div>';
    });
  }

  // XSS আটকাতে — ইউজারের ফ্রি-টেক্সট ইনপুট innerHTML-এ বসানোর আগে ব্যবহার করা হয়
  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  requireAuth((user)=>{
    histUser = user;
    checkBlockedStatus(user.uid);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');
    loadHistory();
  });

</script>
</body>
</html>
