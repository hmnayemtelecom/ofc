<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>

    :root{
      --bg:#050505; --panel:#0a0a0a; --cyan:#00e5ff; --red:#ff2d55;
      --green:#00e676; --yellow:#ffd60a; --blue:#2979ff; --magenta:#ff2dd4;
      --text:#f2f2f2; --muted:#9aa0a6;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{
      background:radial-gradient(circle at top, #101010 0%, #000 70%);
      color:var(--text); font-family:'Segoe UI', Tahoma, sans-serif;
      max-width:520px; margin:0 auto; min-height:100vh;
      padding-bottom:78px; position:relative;
    }
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 14px; border-bottom:2px solid var(--red);
      box-shadow:0 0 18px rgba(255,45,85,0.45);
      background:#000; position:sticky; top:0; z-index:500;
    }
    .topbar .title{
      font-weight:800; font-size:15px; text-align:center; flex:1;
      letter-spacing:0.5px; text-shadow:0 0 8px var(--cyan);
    }
    .icon-btn{
      background:none; border:none; color:var(--cyan); font-size:22px;
      cursor:pointer; text-shadow:0 0 8px var(--cyan); position:relative;
    }
    .back-btn{background:none;border:none;color:var(--cyan);font-size:20px;cursor:pointer;text-shadow:0 0 8px var(--cyan);}
    .container{padding:16px 14px;}
    .section-title{
      text-align:center; color:var(--green); font-size:18px; font-weight:700;
      border-bottom:2px solid var(--cyan); padding-bottom:10px; margin-bottom:16px;
      text-shadow:0 0 8px var(--green);
    }
    .bottom-nav{
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:520px; display:flex; justify-content:space-around;
      background:#000; border-top:2px solid var(--red); padding:10px 0 14px;
      box-shadow:0 0 18px rgba(255,45,85,0.45); z-index:500;
    }
    .nav-item{
      display:flex; flex-direction:column; align-items:center; gap:3px;
      color:var(--muted); text-decoration:none; font-size:11px;
    }
    .nav-item.active{color:var(--cyan); text-shadow:0 0 8px var(--cyan);}
    .nav-item .nav-icon{font-size:20px;}
    .side-menu{
      position:fixed; top:0; left:-320px; width:280px; height:100vh;
      background:#000; border-right:2px solid var(--blue); z-index:2000;
      transition:left 0.3s ease; padding:20px 18px; overflow-y:auto;
      box-shadow:0 0 25px rgba(41,121,255,0.5);
    }
    .side-menu.open{left:0;}
    .side-menu-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1999; display:none;}
    .side-menu-overlay.show{display:block;}
    .side-menu-header{display:flex; align-items:center; gap:12px; margin-bottom:6px; margin-top:20px;}
    .side-menu-header img{width:46px; height:46px; border-radius:50%; border:2px solid var(--red); object-fit:cover;}
    .side-menu-header .name{font-weight:800; font-size:14px;}
    .side-menu-header .ver{font-size:11px; color:var(--muted);}
    .side-menu hr{border:none; border-top:2px solid var(--blue); margin:14px 0;}
    .side-menu a{
      display:block; padding:13px 14px; margin-bottom:10px; border-radius:10px;
      border:1.5px solid var(--cyan); color:#fff; text-decoration:none; font-size:14px;
    }
    .close-menu{position:absolute; top:16px; right:16px; background:none; border:none; color:#fff; font-size:20px;}
    .fab-support{
      position:fixed; bottom:88px; right:16px; width:52px; height:52px;
      border-radius:50%; background:#111; border:2px solid var(--red);
      display:flex; align-items:center; justify-content:center; font-size:24px;
      box-shadow:0 0 16px rgba(255,45,85,0.7); z-index:400; text-decoration:none;
    }
    .loading-wrap{display:flex; align-items:center; justify-content:center; min-height:50vh;}
    .spinner{width:44px; height:44px; border:4px solid #222; border-top-color:var(--cyan); border-radius:50%; animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .hidden{display:none !important;}


    body{padding-bottom:80px;}
    .chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 140px); padding:12px 14px;}
    .chat-messages{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:10px;}
    .msg{max-width:75%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.5;}
    .msg.user{align-self:flex-end; background:#001a33; border:1.5px solid var(--cyan); color:#fff; border-bottom-right-radius:2px;}
    .msg.admin{align-self:flex-start; background:#1a0000; border:1.5px solid var(--red); color:#fff; border-bottom-left-radius:2px;}
    .msg .time{display:block; font-size:10px; color:var(--muted); margin-top:4px;}
    .chat-input-row{display:flex; gap:10px; padding:10px 0 4px;}
    .chat-input-row input{
      flex:1; padding:12px; border-radius:24px; border:1.5px solid var(--blue); background:#000; color:#fff; font-size:14px;
    }
    .chat-send{
      width:46px; height:46px; border-radius:50%; border:none; background:var(--cyan); color:#000;
      font-size:18px; cursor:pointer; flex-shrink:0;
    }
    .empty-chat{text-align:center; color:var(--muted); padding:40px 20px; font-size:13px;}

</style>
</head>
<body>

  <div class="topbar">
    <button class="icon-btn" onclick="openMenu()"><i class="fa-solid fa-bars"></i></button>
    <div class="title">ইনবক্স</div>
    <button class="icon-btn" onclick="window.location.href='notifications.html'"><i class="fa-solid fa-bell"></i></button>
  </div>
<div id="loading" class="loading-wrap"><div class="spinner"></div></div>
<div id="main-content" class="hidden">



<div class="chat-wrap">
  <div class="chat-messages" id="chatMessages">
    <div class="empty-chat">এডমিন টিমকে মেসেজ পাঠান, শীঘ্রই রিপ্লাই পাবেন</div>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="মেসেজ লিখুন...">
    <button class="chat-send" onclick="sendMessage()">➤</button>
  </div>
</div>

</div>


<div class="bottom-nav">
  <a href="home.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-house"></i></span>হোম</a>
  <a href="chat.html" class="nav-item active"><span class="nav-icon"><i class="fa-solid fa-comment-dots"></i></span>ইনবক্স</a>
  <a href="profile.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-user"></i></span>প্রফাইল</a>
</div>


<div class="side-menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
<div class="side-menu" id="sideMenu">
  <button class="close-menu" onclick="closeMenu()"><i class="fa-solid fa-xmark"></i></button>
  <div class="side-menu-header">
    <img src="png/logo.png" alt="logo" onerror="this.src='https://placehold.co/46x46/000/0ff?text=HM'">
    <div>
      <div class="name">HM-NAYEM-TELECOM<br>BANGLADESH</div>
      <div class="ver">Version: 0.9.205</div>
    </div>
  </div>
  <hr>
  <a href="privacy-policy.html">Privacy and Policy</a>
  <a href="rules.html">Rules</a>
  <a href="about.html">About</a>
  <a href="developer-info.html">Developer Info</a>
</div>

<script src="firebase-config.js"></script>
<script>

  function openMenu(){
    document.getElementById('sideMenu').classList.add('open');
    document.getElementById('menuOverlay').classList.add('show');
  }
  function closeMenu(){
    document.getElementById('sideMenu').classList.remove('open');
    document.getElementById('menuOverlay').classList.remove('show');
  }


  let chatUser = null;

  function renderMessage(m){
    const div = document.createElement('div');
    div.className = 'msg ' + (m.sender === 'admin' ? 'admin' : 'user');
    const time = m.createdAt ? new Date(m.createdAt).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'}) : '';
    // ইউজার/এডমিনের টেক্সটে HTML/script থাকলেও যেন সরাসরি রেন্ডার না হয় (XSS আটকাতে)
    const textSpan = document.createElement('span');
    textSpan.textContent = m.text;
    div.appendChild(textSpan);
    const timeSpan = document.createElement('span');
    timeSpan.className = 'time';
    timeSpan.textContent = time;
    div.appendChild(timeSpan);
    return div;
  }

  function listenMessages(uid){
    db.ref('chats/' + uid + '/messages').orderByChild('createdAt')
      .on('value', snap => {
        const wrap = document.getElementById('chatMessages');
        wrap.innerHTML = '';
        if(!snap.exists()){
          wrap.innerHTML = '<div class="empty-chat">এডমিন টিমকে মেসেজ পাঠান, শীঘ্রই রিপ্লাই পাবেন</div>';
          return;
        }
        snap.forEach(child => wrap.appendChild(renderMessage(child.val())));
        wrap.scrollTop = wrap.scrollHeight;
      });
  }

  function sendMessage(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text || !chatUser) return;
    input.disabled = true;
    db.ref('chats/' + chatUser.uid + '/messages').push({
      text, sender:'user', createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      input.value = '';
    }).catch(() => {
      showToast('মেসেজ পাঠানো যায়নি, আবার চেষ্টা করুন', 'error');
    }).finally(() => {
      input.disabled = false;
      input.focus();
    });
  }

  document.addEventListener('keypress', (e) => {
    if(e.target.id === 'chatInput' && e.key === 'Enter') sendMessage();
  });

  requireAuth((user)=>{
    chatUser = user;
    checkBlockedStatus(user.uid);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');
    listenMessages(user.uid);
  });

</script>
</body>
</html>
